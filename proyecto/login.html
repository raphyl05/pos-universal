<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSUniversal - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/login-style.css">
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <div class="logo">
                <img src="logo.jpg" alt="POSUniversal">
            </div>
            <h1 class="tagline">Controla tu negocio<br>desde un solo lugar.</h1>
        </div>

        <div class="right-panel">
            <div class="login-card">
                <h2 id="form-title">Iniciar sesión</h2>

                <form id="login-form" novalidate>
                    <div class="form-group">
                        <label for="username">Nombre de usuario</label>
                        <input type="text" id="username" name="username" autocomplete="username" required placeholder="admin">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn-primary">Iniciar sesión</button>
                </form>

                <p class="toggle-link">
                    ¿No tienes cuenta?
                    <a href="#" id="toggle-register">Crear cuenta</a>
                </p>

                <div id="error-msg" class="error-msg" style="display:none;"></div>

                <form id="register-form" novalidate style="display:none;">
                    <div class="form-group">
                        <label for="reg-nombre">Nombre completo</label>
                        <input type="text" id="reg-nombre" name="nombre" required placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="reg-username">Nombre de usuario</label>
                        <input type="text" id="reg-username" name="reg-username" required placeholder="mínimo 3 caracteres" minlength="3">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" name="reg-password" required placeholder="mínimo 4 caracteres" minlength="4">
                    </div>
                    <div class="form-group">
                        <label for="reg-confirm">Confirmar contraseña</label>
                        <input type="password" id="reg-confirm" name="reg-confirm" required placeholder="Repite la contraseña">
                    </div>
                    <p class="role-hint">Tu rol será: <strong>Cajero</strong>. Para asignar rol Administrador, contacta a un administrador.</p>
                    <button type="submit" class="btn-primary">Crear cuenta</button>
                    <p class="toggle-link">
                        ¿Ya tienes cuenta?
                        <a href="#" id="toggle-login">Iniciar sesión</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script>
        (function () {
            "use strict";

            var loginForm = document.getElementById("login-form");
            var registerForm = document.getElementById("register-form");
            var loginToggle = document.getElementById("toggle-login");
            var registerToggle = document.getElementById("toggle-register");
            var formTitle = document.getElementById("form-title");
            var errorMsg = document.getElementById("error-msg");

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = "block";
            }

            function hideError() {
                errorMsg.style.display = "none";
            }

            function showLogin() {
                loginForm.style.display = "block";
                registerForm.style.display = "none";
                formTitle.textContent = "Iniciar sesión";
                hideError();
            }

            function showRegister() {
                loginForm.style.display = "none";
                registerForm.style.display = "block";
                formTitle.textContent = "Crear cuenta";
                hideError();
            }

            loginToggle.addEventListener("click", function (e) {
                e.preventDefault();
                showLogin();
            });

            registerToggle.addEventListener("click", function (e) {
                e.preventDefault();
                showRegister();
            });

            loginForm.addEventListener("submit", function (e) {
                e.preventDefault();
                hideError();

                var username = document.getElementById("username").value.trim();
                var password = document.getElementById("password").value;

                if (!username || !password) {
                    showError("Completa todos los campos.");
                    return;
                }

                var result = POS_DATA.loginUsuario(username, password);

                if (result.exito) {
                    window.location.href = "dashboard.html";
                } else {
                    showError(result.error);
                }
            });

            registerForm.addEventListener("submit", function (e) {
                e.preventDefault();
                hideError();

                var nombre = document.getElementById("reg-nombre").value.trim();
                var username = document.getElementById("reg-username").value.trim();
                var password = document.getElementById("reg-password").value;
                var confirm = document.getElementById("reg-confirm").value;

                if (!nombre || !username || !password || !confirm) {
                    showError("Completa todos los campos.");
                    return;
                }

                if (password !== confirm) {
                    showError("Las contraseñas no coinciden.");
                    return;
                }

                var result = POS_DATA.registrarUsuario(username, password, nombre);

                if (result.exito) {
                    showError("Cuenta creada. Ahora inicia sesión.");
                    showLogin();
                    document.getElementById("username").value = username;
                    document.getElementById("password").focus();
                } else {
                    showError(result.error);
                }
            });

            if (POS_DATA.isLoggedIn()) {
                window.location.href = "dashboard.html";
            }
        })();
    </script>

</body>

</html>
