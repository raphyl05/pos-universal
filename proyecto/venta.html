<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta #000184 - POSUniversal</title>
    <link rel="stylesheet" href="css/venta-style.css">
</head>

<body>
    <div class="pos">
        <!-- Encabezado -->
        <header class="page-head">
            <h1>Facturación</h1>
            <div class="header-center">
                <input type="date" id="sale-date">
            </div>
            <div class="header-right">
                <span class="invoice-code">Venta #<span id="invoice-number">000000</span></span>
                <button class="more-btn" id="more-btn" aria-label="Ms opciones">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1" /><circle
                        cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
                </button>
            </div>
        </header>

        <!-- ===== STOCK MODAL FLOTANTE ===== -->
        <div class="inv-overlay" id="inv-overlay" aria-hidden="true">
            <div class="inv-modal" role="dialog" aria-label="Stock">
                <div class="inv-head">
                    <h2>Stock</h2>
                    <button class="inv-close" id="inv-close" aria-label="Cerrar stock">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18" /><line
                            x1="6" y1="6" x2="18" y2="18" /></svg>
                    </button>
                </div>
                <div class="inv-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><line
                        x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
                    <input type="text" id="inv-search-input" placeholder="Buscar producto, codigo o escanear..." autofocus>
                </div>
                <nav class="inv-tabs" aria-label="Categoras stock">
                    <button class="inv-tab active" type="button">Todos</button>
                    <button class="inv-tab" type="button">Bebidas</button>
                    <button class="inv-tab" type="button">Alimentos</button>
                    <button class="inv-tab" type="button">Limpieza</button>
                    <button class="inv-tab" type="button">Cuidado personal</button>
                    <button class="inv-tab" type="button">Otros</button>
                </nav>
                <div class="inv-grid"></div>
            </div>
        </div>

        <!-- ===== FACTURAS MODAL ===== -->
        <div class="fact-overlay" id="fact-overlay" aria-hidden="true">
            <div class="fact-modal" role="dialog" aria-label="Buscar facturas">
                <div class="fact-head">
                    <h2>Buscar Facturas</h2>
                    <button class="fact-close" id="fact-close" aria-label="Cerrar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18" /><line
                            x1="6" y1="6" x2="18" y2="18" /></svg>
                    </button>
                </div>
                <div class="fact-filters">
                    <input type="date" id="fact-date-from" class="fact-date">
                    <span class="fact-sep">—</span>
                    <input type="date" id="fact-date-to" class="fact-date">
                    <button id="fact-search-btn" type="button" class="fact-search-btn">Buscar</button>
                </div>
                <div class="fact-list" id="fact-list"></div>
            </div>
        </div>

        <!-- ===== CARRITO PRINCIPAL ===== -->
        <div class="cart">

            <!-- Barra superior: Stock + buscador + sugerencias -->
            <div class="cart-topbar">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><line
                        x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
                    <input type="text" id="code-input" placeholder="Codigo o escanear..." autofocus>
                    <div id="code-suggestions" class="code-suggestions"></div>
                </div>
                <button class="btn-inventario" id="btn-inventario" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1" /><rect
                        x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect
                        x="14" y="14" width="7" height="7" rx="1" /></svg>
                    Stock
                </button>
                <button class="btn-facturas" id="btn-facturas" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Facturas
                </button>
            </div>

            <!-- Tabla del carrito -->
            <div class="cart-table">
                <div class="cart-row cart-row-head">
                    <span class="col-cod">Código</span>
                    <span class="col-product">Producto</span>
                    <span class="col-qty">Cant</span>
                    <span class="col-price">Precio</span>
                    <span class="col-total">Total</span>
                    <span class="col-action"></span>
                </div>
                <div class="cart-list" id="cart-list"></div>
            </div>

            <!-- Abajo: Cliente + Totales -->
            <div class="cart-bottom">
                <div class="client-section">
                    <div class="client-row">
                        <input type="text" id="client-nombre" placeholder="Nombre">
                        <input type="text" id="client-telefono" placeholder="Teléfono">
                        <input type="text" id="client-cedula" placeholder="RNC/Cédula">
                    </div>
                    <div class="client-address-row">
                        <input type="text" id="client-direccion" placeholder="Dirección">
                    </div>
                </div>
                <div class="totals" id="totals-section">
                    <div class="total-row">
                        <span class="total-label">Subtotal</span>
                        <span class="total-value" id="cart-subtotal">RD$ 0.00</span>
                    </div>
                    <div class="total-row">
                        <span class="total-label">Descuento %</span>
                        <input type="number" id="discount-input" class="discount-input" min="0" max="100" value="0" step="0.1">
                        <span class="total-value" id="cart-discount">RD$ 0.00</span>
                    </div>
                    <div class="total-row">
                        <span class="total-label">Total ITBIS</span>
                        <span class="total-value" id="cart-itbis">RD$ 0.00</span>
                    </div>
                </div>
            </div>

            <!-- Checkout -->
            <div class="checkout-bar">
                <div class="checkout-total">
                    <span class="checkout-label">Total a pagar</span>
                    <strong class="checkout-value" id="cart-total">RD$ 0.00</strong>
                </div>
                <select id="payment-method" class="payment-select checkout-select">
                    <option value="Efectivo" selected>Efectivo</option>
                    <option value="Tarjeta">Tarjeta</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Mixto">Mixto</option>
                </select>
                <button class="btn-cobrar" type="button">COBRAR</button>
                <button class="btn-guardar" type="button">Guardar venta</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/venta.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
